name: Build Radar Emocional APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct project
        shell: bash
        run: |
          cat > payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d payload.b64 > project.zip
          unzip -q project.zip
          rm -f payload.b64 project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radar-Emocional-APK
          path: app/build/outputs/apk/debug/app-debug.apk
